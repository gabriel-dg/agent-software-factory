<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Monty Hall Problem</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-family-body);
    font-size: var(--font-size-base);
    line-height: var(--line-height-body);
  }
  h1, h2, h3, h4 {
    font-family: var(--font-family-heading);
    line-height: var(--line-height-heading);
    color: var(--color-text-primary);
    letter-spacing: var(--letter-spacing-tight);
    margin: 0 0 var(--space-sm) 0;
  }
  h2 { font-size: var(--font-size-xl); }
  h3 { font-size: var(--font-size-lg); }
  p { margin: 0 0 var(--space-sm) 0; }
  .wrap { max-width: var(--content-max-width); margin: 0 auto; padding: 0 var(--container-padding-inline); }
  .wrap-wide { max-width: var(--content-max-width-wide); margin: 0 auto; padding: 0 var(--container-padding-inline); }
  main { display: block; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Beats are treated as cards/panels: explicit surface backgrounds
     instead of leaving them to inherit --color-bg-page, per DESIGN.md's
     "cards, panels, doors' container" contrast pairs. Alternates
     surface / surface-alt so both verified tokens are actually used. */
  section.beat {
    padding: var(--space-2xl) var(--container-padding-inline);
    margin: var(--space-lg) auto;
    border-radius: var(--radius-lg);
    background: var(--color-bg-surface);
    box-shadow: var(--shadow-sm);
  }
  section.beat.wrap-wide { max-width: var(--content-max-width-wide); }
  section.beat:not(.wrap-wide) { max-width: var(--content-max-width); }
  section.beat:nth-of-type(even) { background: var(--color-bg-surface-alt); }
  section.beat.locked, footer.site-footer.locked { display: none; }

  .site-header { padding: var(--space-2xl) 0 var(--space-lg) 0; }
  .site-header h1 { font-size: var(--font-size-3xl); }
  .site-header .subtitle { font-size: var(--font-size-md); color: var(--color-text-secondary); }
  .site-header .intro { font-size: var(--font-size-base); color: var(--color-text-secondary); max-width: var(--content-max-width); }
  .data { font-family: var(--font-family-mono); }

  /* buttons */
  button { font-family: inherit; }
  .btn-primary, .btn-secondary {
    display: inline-block;
    border-radius: var(--radius-md);
    padding: var(--space-xs) var(--space-md);
    font-size: var(--font-size-base);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
    margin: var(--space-2xs) var(--space-xs) var(--space-2xs) 0;
  }
  .btn-primary { background: var(--color-button-primary-bg); color: var(--color-button-primary-text); border: var(--border-width-thin) solid var(--color-button-primary-bg); }
  .btn-primary:hover { background: var(--color-button-primary-bg-hover); border-color: var(--color-button-primary-bg-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--color-button-secondary-bg); color: var(--color-button-secondary-text); border: var(--border-width-thin) solid var(--color-button-secondary-border); }
  .btn-secondary:hover { background: var(--color-button-secondary-bg-hover); }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
  }

  /* poll options */
  .poll-options { margin: var(--space-sm) 0; }
  .poll-option {
    display: block; width: 100%; text-align: left;
    background: var(--color-option-unselected-bg);
    border: var(--border-width-thin) solid var(--color-option-unselected-border);
    color: var(--color-option-unselected-text);
    border-radius: var(--radius-md);
    padding: var(--space-sm);
    margin-bottom: var(--space-2xs);
    cursor: pointer;
    font-size: var(--font-size-base);
  }
  .poll-option.selected {
    background: var(--color-option-selected-bg);
    border-color: var(--color-option-selected-border);
    color: var(--color-option-selected-text);
  }

  /* callouts */
  .callout {
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    border-left: var(--border-width-emphasis) solid;
    margin: var(--space-md) 0;
    line-height: var(--line-height-relaxed);
  }
  .callout-label {
    font-weight: var(--font-weight-semibold);
    display: block;
    margin-bottom: var(--space-2xs);
    text-transform: uppercase;
    letter-spacing: var(--letter-spacing-wide);
    font-size: var(--font-size-xs);
  }
  .callout-key { background: var(--color-callout-key-bg); border-color: var(--color-callout-key-border); color: var(--color-callout-key-text); }
  .callout-reminder { background: var(--color-callout-reminder-bg); border-color: var(--color-callout-reminder-border); color: var(--color-callout-reminder-text); }
  .callout-stat { background: var(--color-callout-stat-bg); border-color: var(--color-callout-stat-border); color: var(--color-callout-stat-text); }
  .callout-neutral { background: var(--color-callout-neutral-bg); border-color: var(--color-callout-neutral-border); color: var(--color-callout-neutral-text); }

  /* rules list */
  ol.rules-list { padding-left: 1.25em; }
  ol.rules-list li { margin-bottom: var(--space-sm); }
  ol.rules-list li.rule-host {
    list-style: none;
    margin-left: -1.25em;
    background: var(--color-callout-key-bg);
    border: var(--border-width-thin) solid var(--color-callout-key-border);
    color: var(--color-callout-key-text);
    padding: var(--space-sm);
    border-radius: var(--radius-md);
    font-weight: var(--font-weight-medium);
  }

  /* doors */
  .door-grid-3, .door-grid-100 {
    background: var(--color-bg-surface);
    border: var(--border-width-hairline) solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
  }
  .door-grid-3 { display: flex; gap: var(--grid-gap-doors-3); flex-wrap: wrap; justify-content: center; margin: var(--space-md) 0; padding: var(--space-md); }
  .door-grid-100 { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--grid-gap-doors-100); margin: var(--space-md) 0; max-width: var(--max-width-door-grid-100); padding: var(--space-md); }
  .door {
    width: var(--door-size-lg); height: var(--door-size-lg);
    border-radius: var(--radius-md);
    border-width: var(--border-width-thick);
    border-style: solid;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: var(--font-family-mono);
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
    position: relative;
    gap: var(--space-3xs);
    transition: background-color var(--duration-door-open) var(--easing-emphasize),
                border-color var(--duration-door-open) var(--easing-emphasize),
                color var(--duration-door-open) var(--easing-emphasize);
  }
  .door-sm { width: var(--door-size-sm); height: var(--door-size-sm); font-size: var(--font-size-xs); }
  .door-sm .door-icons { font-size: 0.85em; }
  .door-sm .reveal-caption { font-size: 0.6rem; line-height: 1.1; }
  .door-unselected { background: var(--color-door-unselected-bg); border-color: var(--color-door-unselected-border); color: var(--color-door-unselected-text); }
  .door-unselected:hover { filter: brightness(0.96); }
  .door-picked { background: var(--color-door-picked-bg); border-color: var(--color-door-picked-border); color: var(--color-door-picked-text); }
  .door-host-opened { background: var(--color-door-host-opened-bg); border-color: var(--color-door-host-opened-border); color: var(--color-door-host-opened-text); cursor: default; }
  .door-remaining { background: var(--color-door-remaining-bg); border-color: var(--color-door-remaining-border); color: var(--color-door-remaining-text); }
  .door[disabled] { cursor: default; }
  .door-icon { font-size: 1.2em; }

  /* Beat 2 door-ineligibility marking (DESIGN.md Sec.1 item 4). Two
     independent, non-competing visual channels are layered on the
     reader's own picked door and the door the host just opened at
     reveal time, and ONLY on those two doors -- never on the remaining,
     still-undecided door, so nothing here discloses which door (if
     either) holds the prize before the reader chooses.
     Channel (a), "not clickable right now" (a UI-interaction fact): the
     exact same --opacity-control-disabled / --cursor-disabled pairing
     already used by .btn-primary:disabled / .btn-secondary:disabled
     elsewhere on the page. Generic, page-wide, no new hue or icon.
     The extra [disabled] in the selector plus two classes gives this
     rule enough specificity to win over the plain `.door[disabled]`
     cursor rule above for these two doors specifically. */
  .door[disabled].door-ineligible-interaction {
    opacity: var(--opacity-control-disabled);
    cursor: var(--cursor-disabled);
  }
  /* Channel (b), "the host's rule structurally could not have opened
     this door" (a game-logic fact): its own dedicated dark-graphite
     "ink stamp" badge and glyph, rendered alongside (not instead of)
     the door's existing identity icon (star / X). Positioned with the
     existing spacing scale (space-2xs, negated, matches the badge's
     prior -0.5rem offset) rather than a new magic offset, and sized
     with the spacing scale + shape tokens rather than an invented
     pixel size. */
  .door-ineligible-badge {
    position: absolute;
    top: calc(-1 * var(--space-2xs));
    right: calc(-1 * var(--space-2xs));
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: var(--space-md);
    min-height: var(--space-md);
    padding: var(--space-3xs);
    border-radius: var(--radius-badge-ineligible);
    border-style: var(--border-style-door-ineligible);
    border-width: var(--border-width-door-ineligible);
    background: var(--color-door-ineligible-badge-bg);
    border-color: var(--color-door-ineligible-badge-border);
    color: var(--color-door-ineligible-badge-text);
    font-size: var(--font-size-xs);
    line-height: 1;
  }

  /* icon glyphs from token content strings */
  .icon-prize::before { content: var(--icon-prize-content); }
  .icon-goat::before { content: var(--icon-goat-content); }
  .icon-picked::before { content: var(--icon-picked-content); }
  .icon-host-opened::before { content: var(--icon-host-opened-content); }
  .icon-remaining::before { content: var(--icon-remaining-content); }
  .icon-host-knowing::before { content: var(--icon-host-knowing-content); }
  .icon-host-random::before { content: var(--icon-host-random-content); }
  .icon-case-forced::before { content: var(--icon-case-forced-content); }
  .icon-case-free::before { content: var(--icon-case-free-content); }
  .icon-spoiled::before { content: var(--icon-spoiled-content); }
  .icon-door-ineligible::before { content: var(--icon-door-ineligible-content); }
  .icon-round-played::before { content: var(--icon-round-played-content); }

  /* reveal cards */
  .reveal-row { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin: var(--space-md) 0; align-items: flex-end; }
  @keyframes reveal-pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .reveal-card {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: var(--size-reveal-card); height: var(--size-reveal-card);
    border-width: var(--border-width-thick);
    text-align: center;
    padding: var(--space-2xs);
    gap: var(--space-3xs);
    animation: reveal-pop var(--duration-door-open) var(--easing-emphasize);
  }
  .reveal-caption { font-size: var(--font-size-xs); display: block; }
  .reveal-prize {
    background: var(--color-reveal-prize-bg); border-color: var(--color-reveal-prize-border); color: var(--color-reveal-prize-text);
    border-radius: var(--radius-badge-prize); border-style: var(--border-style-prize); background-image: var(--pattern-reveal-prize);
  }
  .reveal-goat {
    background: var(--color-reveal-goat-bg); border-color: var(--color-reveal-goat-border); color: var(--color-reveal-goat-text);
    border-radius: var(--radius-badge-goat); border-style: var(--border-style-goat); background-image: var(--pattern-reveal-goat);
  }
  .reveal-card .icon-prize::before, .reveal-card .icon-goat::before { font-size: var(--font-size-2xl); }

  /* host contrast cards */
  .host-cards { display: flex; gap: var(--space-md); flex-wrap: wrap; margin: var(--space-md) 0; }
  .host-card { border-radius: var(--radius-md); padding: var(--space-md); border-width: var(--border-width-thick); flex: 1 1 16rem; }
  .host-card h4 { margin-bottom: var(--space-2xs); }
  .host-knowing { background: var(--color-host-knowing-bg); border-color: var(--color-host-knowing-border); color: var(--color-host-knowing-text); border-style: var(--border-style-host-knowing); }
  .host-random { background: var(--color-host-random-bg); border-color: var(--color-host-random-border); color: var(--color-host-random-text); border-style: var(--border-style-host-random); }
  /* The global `h1, h2, h3, h4 { color: ... }` rule above is an element-type
     selector with no rule directly on the h4 itself inside .host-knowing/
     .host-random, so it wins the cascade over the class-on-ancestor color set
     above and the heading was rendering in --color-text-primary instead of
     the verified --color-host-knowing-text/--color-host-random-text pair.
     Scope an explicit rule to the h4 itself to fix it. */
  .host-knowing h4 { color: var(--color-host-knowing-text); }
  .host-random h4 { color: var(--color-host-random-text); }
  .host-result { margin-top: var(--space-sm); font-family: var(--font-family-mono); font-size: var(--font-size-sm); }
  .spoiled-note {
    background: var(--color-spoiled-bg); border: var(--border-width-thin) solid var(--color-spoiled-border); color: var(--color-spoiled-text);
    padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-sm); margin-top: var(--space-2xs); display: inline-block;
    font-family: var(--font-family-mono); font-size: var(--font-size-sm);
  }

  /* Beat 3 spoiled-vs-played round grid (Host B). Each cell is one
     simulated round: a spoiled cell (host revealed the prize outright)
     is visually distinct from a played cell (host revealed a goat),
     using the tokens reserved specifically for this state, not just a
     recolored count. See SPEC.md revision 6, Beat 3 / §4 item 8. */
  .round-grid-wrap { margin: var(--space-md) 0; }
  /* gap: sized to --border-width-thin (2px) -- no --space-* scale value
     is 2px, but this is one of the four token families the magic-value
     cleanup allows drawing from, and it matches exactly.
     max-width and the cell dimensions below are component-specific
     dimension tokens minted by art-director for this one fixed-count
     grid (--max-width-round-grid, --size-round-cell,
     --font-size-round-cell) -- see tokens.css and DESIGN.md §4. */
  .round-grid { display: flex; flex-wrap: wrap; gap: var(--border-width-thin); max-width: var(--max-width-round-grid); }
  .round-cell {
    width: var(--size-round-cell); height: var(--size-round-cell);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--font-size-round-cell); line-height: 1;
    border-width: var(--border-width-hairline);
    border-color: transparent;
  }
  /* Beat 3 played-vs-spoiled cells (DESIGN.md Sec.1 item 5 / Sec.6):
     shape + border-style + icon, not color alone. Played is square-ish/
     solid-bordered/checkmark ("ordinary"); spoiled is circular/dashed-
     bordered/explosion ("notable event"), echoing the same solid-is-
     ordinary / dashed-is-exception grammar as the knowing/random host
     cards. The per-cell icon element (see roundGridHtml in viz.js) is
     never aria-hidden, since for an individual cell it's the only
     carrier of that cell's status. */
  .round-cell-played {
    background: var(--color-host-random-bg); border-color: var(--color-host-random-border);
    border-radius: var(--radius-round-cell-played); border-style: var(--border-style-round-played);
  }
  .round-cell-spoiled {
    background: var(--color-spoiled-bg); border-color: var(--color-spoiled-border); color: var(--color-spoiled-text);
    border-radius: var(--radius-round-cell-spoiled); border-style: var(--border-style-round-spoiled);
  }
  /* Legend: two separate label classes (not one shared color rule) so
     each label uses the token family that actually matches its state --
     "Played" reuses the host-random text token, "Spoiled" uses the
     dedicated spoiled-text token. The color swatches may stay
     aria-hidden (each sits next to its own visible text label) and
     reuse the same shape/border-style tokens as the real cells above
     for visual consistency. */
  .round-grid-legend { display: flex; gap: var(--space-md); margin-top: var(--space-2xs); font-size: var(--font-size-xs); align-items: center; }
  .round-grid-legend .legend-label-played { color: var(--color-host-random-text); }
  /* Unlike .legend-label-played (which inherits the enclosing
     .host-card.host-random's --color-host-random-bg -- an already-
     verified, declared pair), this label needs its own small background
     box: --color-spoiled-text is only a declared/verified pair against
     --color-spoiled-bg (DESIGN.md ledger, 11.47 AA-NORMAL), not against
     the host-random card background it would otherwise inherit. Padding/
     radius/border reuse the exact tokens already used together for the
     spoiled swatch/cell/note elsewhere on the page (.swatch-spoiled,
     .round-cell-spoiled, .spoiled-note) rather than inventing new sizing;
     padding is the smaller --space-3xs/--space-2xs pairing (vs.
     .spoiled-note's larger --space-2xs/--space-sm) to stay proportionate
     to this legend row's small --size-round-cell swatch and
     --font-size-xs text. */
  .round-grid-legend .legend-label-spoiled {
    display: inline-block;
    vertical-align: middle;
    background: var(--color-spoiled-bg);
    border: var(--border-width-hairline) solid var(--color-spoiled-border);
    color: var(--color-spoiled-text);
    padding: var(--space-3xs) var(--space-2xs);
    border-radius: var(--radius-sm);
    line-height: 1;
  }
  .round-grid-legend .swatch {
    display: inline-block; width: var(--size-round-cell); height: var(--size-round-cell); vertical-align: middle; margin-right: var(--space-3xs);
    border-width: var(--border-width-hairline); border-color: transparent;
  }
  .round-grid-legend .swatch-played {
    background: var(--color-host-random-bg); border-color: var(--color-host-random-border);
    border-radius: var(--radius-round-cell-played); border-style: var(--border-style-round-played);
  }
  .round-grid-legend .swatch-spoiled {
    background: var(--color-spoiled-bg); border-color: var(--color-spoiled-border);
    border-radius: var(--radius-round-cell-spoiled); border-style: var(--border-style-round-spoiled);
  }

  /* three-case table */
  table.case-table { width: 100%; border-collapse: collapse; margin: var(--space-md) 0; }
  table.case-table th {
    background: var(--color-table-header-bg); color: var(--color-table-header-text);
    padding: var(--space-xs) var(--space-sm); text-align: left; font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm);
  }
  table.case-table td { padding: var(--space-sm); border-bottom: var(--border-width-hairline) solid var(--color-border-subtle); vertical-align: top; font-size: var(--font-size-sm); }
  table.case-table tr.case-forced td { background: var(--color-case-forced-bg); color: var(--color-case-forced-text); }
  table.case-table tr.case-free td { background: var(--color-case-free-bg); color: var(--color-case-free-text); }
  table.case-table td.case-name { font-weight: var(--font-weight-semibold); white-space: nowrap; }
  .case-table-note { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-2xs); }

  /* "doesn't the specific door tell me something" block (Beat 3, movement 2) */
  .why-door-block { margin-top: var(--space-md); }
  .route-table-block { margin-top: var(--space-md); }
  .routes-grid { display: flex; gap: var(--space-md); flex-wrap: wrap; margin: var(--space-sm) 0; }
  .route-card {
    flex: 1 1 14rem;
    background: var(--color-bg-surface);
    border: var(--border-width-thin) solid var(--color-border-default);
    border-radius: var(--radius-md);
    padding: var(--space-sm);
  }
  .route-label { font-weight: var(--font-weight-semibold); margin-bottom: var(--space-2xs); font-family: var(--font-family-heading); }
  .route-card p:last-child { margin-bottom: 0; }

  /* stat bars */
  .stat-bars { margin: var(--space-md) 0; max-width: 34rem; }
  .stat-bar-row { margin-bottom: var(--space-sm); }
  .stat-bar-caption { font-size: var(--font-size-sm); margin-bottom: var(--space-3xs); color: var(--color-text-secondary); }
  .stat-bar-track { background: var(--color-stat-bar-track-bg); border-radius: var(--radius-pill); overflow: hidden; height: var(--space-lg); position: relative; }
  .stat-bar-fill { height: 100%; display: flex; align-items: center; padding-left: var(--space-sm); font-family: var(--font-family-mono); font-weight: var(--font-weight-semibold); white-space: nowrap; transition: width var(--duration-fast) var(--easing-standard); }
  .stat-bar-stay { background: var(--color-stat-stay-bar-bg); color: var(--color-stat-stay-bar-text); background-image: var(--pattern-stat-stay-bar); }
  .stat-bar-switch { background: var(--color-stat-switch-bar-bg); color: var(--color-stat-switch-bar-text); background-image: var(--pattern-stat-switch-bar); }

  /* faq accordion */
  .faq-item { border-bottom: var(--border-width-hairline) solid var(--color-border-subtle); }
  .faq-question {
    width: 100%; text-align: left; background: none; border: none; padding: var(--space-sm) 0;
    font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; color: var(--color-text-primary);
    font-family: var(--font-family-heading);
  }
  .faq-caret { transition: transform var(--duration-fast) var(--easing-standard); font-size: var(--font-size-md); }
  .faq-item.open .faq-caret { transform: rotate(180deg); }
  .faq-answer { padding: 0 0 var(--space-md); display: none; }
  .faq-answer .callout { margin: var(--space-xs) 0 var(--space-sm); }
  .faq-item.open .faq-answer { display: block; }

  /* recap */
  ul.recap-list { padding-left: 1.25em; }
  ul.recap-list li { margin-bottom: var(--space-sm); line-height: var(--line-height-relaxed); }
  .comparison-box { margin-top: var(--space-md); }

  /* footer */
  footer.site-footer { background: var(--color-bg-inverse); color: var(--color-text-inverse); padding: var(--space-xl) 0; margin-top: var(--space-lg); }
  footer.site-footer .note { color: var(--color-text-inverse-secondary); font-size: var(--font-size-sm); margin-top: var(--space-2xs); }
  /* Colophon: a credits/meta line about how the page itself was produced,
     not a teaching beat. Deliberately the most visually subordinate text
     in the footer -- smaller than .note (--font-size-xs vs --font-size-sm)
     and set off from the rest of the footer by its own top divider and
     extra top margin, so it reads as trailing small print, not as part of
     the page's argument. Reuses the existing, already-verified
     --color-text-inverse-secondary ON --color-bg-inverse pair (DESIGN.md
     Contrast pairs ledger, 9.90 AA-NORMAL) -- the same pair already used
     for .note just above it -- rather than any new color. The divider
     line reuses --color-bg-inverse-alt (an existing surface token, not a
     new hex value) purely as a decorative separator, the same way
     --color-border-subtle/--color-border-default are used elsewhere as
     plain dividers with no ledger entry of their own. */
  footer.site-footer .colophon {
    color: var(--color-text-inverse-secondary);
    font-size: var(--font-size-xs);
    line-height: var(--line-height-body);
    margin-top: var(--space-lg);
    padding-top: var(--space-sm);
    border-top: var(--border-width-hairline) solid var(--color-bg-inverse-alt);
  }
  /* Colophon link: no new color token -- the anchor inherits the
     surrounding --color-text-inverse-secondary ON --color-bg-inverse
     pair (already verified in DESIGN.md's contrast ledger for this
     exact spot). Underline is the only added affordance, so the link
     reads as clickable without introducing an unverified color pair. */
  .colophon a { color: inherit; text-decoration: underline; }
  .footer-card {
    background: var(--color-bg-inverse-alt);
    color: var(--color-text-inverse);
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-2xs);
  }
  .footer-card p { margin: 0; color: var(--color-text-inverse); }

  .status-text { color: var(--color-text-secondary); font-style: italic; }
  .running-total { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: var(--space-2xs); }
</style>
